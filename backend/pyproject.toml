[project]
name = "mars-analog"
version = "0.1.0"
description = "Topographic similarity between terrestrial regions and Mars reference regions (experimental)."
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=2.0",
    "rasterio>=1.4",
    "pyproj>=3.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx2>=2.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mars_analog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
